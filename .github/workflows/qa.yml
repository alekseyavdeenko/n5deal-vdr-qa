name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly regression against the deployed environment. Not on the hour: GitHub delays (or even drops)
    # scheduled runs at the start of every hour, when the load is highest.
    - cron: '37 12 * * *' # 15:37 Kyiv summer time (14:37 in winter); cron is always UTC

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
  OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
  VIEWER_EMAIL: ${{ secrets.VIEWER_EMAIL }}
  VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD }}

jobs:
  # Fast gate: is the deployment up and does it still publish the contract we test against?
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warn when the test accounts are missing
        if: ${{ env.OWNER_EMAIL == '' || env.VIEWER_EMAIL == '' }}
        run: echo "::warning::No test accounts in GitHub secrets - tests that need a login are skipped. Add OWNER_EMAIL, OWNER_PASSWORD, VIEWER_EMAIL, VIEWER_PASSWORD."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright test --project=api --grep "@smoke|@contract"

  api:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: |
            playwright-report
            test-results/junit.xml
          retention-days: 14

  e2e:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 14
